# Dependabot: version updates and security PRs (uv)
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # Version updates: raised against develop.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      version-updates:
        applies-to: "version-updates"
        patterns: ["*"]

  # Security updates: only ever run on the default branch, so this entry has no
  # target-branch. open-pull-requests-limit: 0 disables version updates here so
  # they are not duplicated against main.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps"
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
